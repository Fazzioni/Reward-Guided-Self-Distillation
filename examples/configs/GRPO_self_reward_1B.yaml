# GRPO Algorithm Configuration
grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 2
  max_rollout_turns: 1 # for multi-turn rollouts. Math Environments just have 1 turn (answering the question)
  max_num_epochs: 1
  max_num_steps: 1000000
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 0
  val_start_at: -1  # First step eligible for periodic validation; -1 disables the delay
  val_at_start: false
  val_at_end: false
  overlong_filtering: false
  advantage_clip_low: null
  advantage_clip_high: null
  max_val_samples: 256
  # Validation rollouts per prompt; k > 1 also reports the pass_k metric.
  # max_val_samples counts PROMPTS: total validation rollouts = max_val_samples * k.
  val_num_generations_per_prompt: 1
  # Early stop once this metric (e.g. accuracy or pass_k) reaches the threshold; null disables.
  stop_at_validation_metric: null
  # Required when stop_at_validation_metric is set.
  stop_at_validation_threshold: null
  val_batch_size: 256
  seed: 42
  use_dynamic_sampling: false
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 1
  reward_shaping:
    enabled: false
    overlong_buffer_length: 128
    overlong_buffer_penalty: 1
    max_response_length: ${policy.max_total_sequence_length}
    stop_properly_penalty_coef: null

  # Advantage Estimator Configuration
  # Options: "grpo" (default) or "reinforce_plus_plus"
  adv_estimator:
    #name: "grpo"  # Use "reinforce_plus_plus" for Reinforce++ estimator
    name: "reward_guided_self_distillation"  # Use "reinforce_plus_plus" for Reinforce++ estimator
    normalize_rewards: ${grpo.normalize_rewards}
    use_leave_one_out_baseline: ${grpo.use_leave_one_out_baseline}
    minus_baseline: true  # Reinforce++-baseline specific: subtract per-prompt mean baseline


    hint_start_string: "Hint:\n\n"
    hint_end_string: "hint end.\n\n"
    hint_as_improvement: true  # True -> distil, False -> signal
    kl_coef: 0.05
    kl_clip_min: 0.0
    kl_clip_max: 10



  reward_scaling:
    enabled: false
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0
  seq_logprob_error_threshold: null
  # Advantage value assigned to invalid tool call tokens (e.g. -5.0 to penalize). null disables.
  invalid_tool_call_advantage: null
  # Advantage value assigned to tokens with malformed <think>/</think> tags (e.g. -5.0). null disables.
  malformed_thinking_advantage: null

  async_grpo:
    enabled: false # Set to true to enable async training mode
    # Max age (in training steps) for trajectories used in training
    max_trajectory_age_steps: 1
    # Number of generation-worker failures tolerated before aborting.
    # 0 (default) = fail on the first worker exception. Increase only
    # when transient generation errors are expected and acceptable to drop.
    max_generation_failures: 0
    in_flight_weight_updates: false # Set to true to enable in-flight weight updates
    recompute_kv_cache_after_weight_updates: false # Set to true to recompute kv cache after weight updates.

# Reward-zeroing penalties applied to NeMo-Gym rollout results.
reward_penalties:
  penalize_duplicated_reasoning: false
  penalize_empty_final_answer: false
  penalize_unwanted_tokens: false
  penalize_malformed_think_tag: false
  # Optional model/tokenizer-specific token IDs. Add token IDs that should
  # be penalized when emitted by the model. Unwanted token IDs must be
  # specified explicitly; think-tag IDs are inferred when each tag encodes
  # to one token. Example: {unwanted: [2], think_open: 12, think_close: 13}
  token_ids: null

loss_fn:
  reference_policy_kl_penalty: 0.01
  # Can be set to k1, k2, k3
  # For more details, see http://joschu.net/blog/kl-approx.html
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: 20.0
  kl_output_clamp_value: 10.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  ratio_clip_c: null
  # (default off) loss formulation improvements (docs/guides/grpo.md#loss)
  use_on_policy_kl_approximation: false
  # Async GRPO requires importance sampling correction enabled
  # Set to true when async_grpo.enabled is true
  use_importance_sampling_correction: false
  # "tis"          – clamp IS weights to [min, max], where min defaults to 0
  # "icepop"       – zero out tokens with IS weight outside [min, max]
  # "seq-mask-tis" – zero out sequences by geometric-mean IS ratio, non-truncated token IS correction
  truncated_importance_sampling_type: null
  truncated_importance_sampling_ratio: null
  # TIS lower bound; null means 0 for TIS. Set explicitly for ICE-POP / seq-mask-tis.
  truncated_importance_sampling_ratio_min: null
  sequence_level_importance_ratios: false
  token_level_loss: true
  force_on_policy_ratio: false  # Set to true to force ratio=1.0 (requires train_global_batch_size == num_prompts_per_step * num_generations_per_prompt)
  use_kl_in_reward: false  # Reinforce++: add KL penalty to reward instead of loss
  use_cispo: false  # CISPO (https://arxiv.org/abs/2506.13585): clipped IS-weight policy optimization
  # Disable PPO ratio (curr_logprobs - prev_logprobs).exp(); falls back to REINFORCE-style
  # surrogate loss. Used by REINFORCE/RLOO. See https://arxiv.org/abs/2402.14740
  disable_ppo_ratio: false
  # VAPO positive-example NLL loss weight: L = L_PPO + mu * L_NLL(correct samples).
  # 0.0 disables it. VAPO paper recommends 0.1.
  positive_example_nll_weight: 0.0

checkpointing:
  enabled: true
  checkpoint_dir: "/raid/aluno_daniel/cemig-self-reward/${logger.wandb.name}"
  metric_name: "val:accuracy" # one of "val:" or "train:" followed by the metric name
  higher_is_better: true
  keep_top_k: 3
  save_period: 10
  checkpoint_must_save_by: null
  # Async GRPO: restore replay-buffer state on resume. Set false to regenerate
  # the buffered window fresh instead of reusing completed groups (which skew
  # toward short rollouts at a save boundary).
  load_replay_buffer: true
  model_save_format: "safetensors"
  save_consolidated: false
  save_optimizer: true
  # SingleController only: include native TQ state and the metadata-only replay
  # index. Required for recovery-capable samplers to preserve completed,
  # unconsumed rollouts.
  save_data_plane: false

policy:
  model_name: "Qwen/Qwen3-0.6B"
  tokenizer:
    name: ${policy.model_name} ## specify if you'd like to use a tokenizer different from the model's default
    chat_template_kwargs: null # can be used to pass kwargs to the chat template, e.g., enable_thinking=true
    tokenizer_kwargs: null # extra kwargs forwarded to tokenizer loading, e.g., {fix_mistral_regex: false}
    use_fastokens: false # opt-in Rust-backed BPE tokenizer for NeMo-RL tokenization; NRL_USE_FASTOKENS overrides this and also sets VLLM_USE_FASTOKENS.
  hf_config_overrides: {}
  train_global_batch_size: 2
  train_micro_batch_size: 1
  generation_batch_size: 32 # Only used when generating using HF backend
  logprob_batch_size: ${policy.train_micro_batch_size}
  max_total_sequence_length: 8192
  precision: "bfloat16"
  logprob_chunk_size: null
  offload_optimizer_for_logprob: false # Only useful for non-colocated generation since colocated generation will always offload optimizer to cuda before refit
  worker_extension_cls_fqn: null # optional registered policy-worker subclass; mutually exclusive with quant_cfg

  dtensor_cfg:
    _v2: true
    enabled: true
    cpu_offload: False
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

    # Automodel kwargs passed to from_pretrained.
    # Uncomment force_hf if the custom model's adapter doesn't support per-tensor
    # weight conversion (e.g. Qwen2, Llama). Auto-detected if not set.
    # See https://github.com/NVIDIA-NeMo/RL/issues/2072
    automodel_kwargs: {}
      # force_hf: true

    # LoRA (Low-Rank Adaptation) Configuration
    lora_cfg:
      enabled: False  # Set to True to enable LoRA fine-tuning
      target_modules: []  # List of module names to apply LoRA (empty list with match_all_linear=true applies to all linear layers)
      exclude_modules: []  # List of module names to exclude from LoRA
      match_all_linear: true  # If True, applies LoRA to all linear layers (overrides target_modules)
      dim: 8  # LoRA rank (r): lower rank = fewer parameters but less capacity. Typical values: 4, 8, 16, 32, 64
      alpha: 32  # LoRA scaling factor: effective learning rate multiplier = alpha/dim. Typical values: 16, 32, 64
      dropout: 0.0  # Dropout probability applied to LoRA layers (0.0 = no dropout)
      dropout_position: "post"  # Where to apply dropout: "pre" (before LoRA) or "post" (after LoRA)
      lora_A_init: "xavier"  # Initialization method for LoRA A matrix: "xavier" or "uniform"
      use_triton: true  # Use Triton-optimized kernels for LoRA (faster but requires flash-attn). Disable when tensor_parallel_size > 1
      restore_from: null  # Warm start: path to a PEFT adapter checkpoint (adapter_model.safetensors + adapter_config.json) to initialize this run's LoRA weights from, e.g. a previous SFT run's step_*/policy/weights
 
  draft:
    # Draft co-training speculator. Currently only eagle3 is supported.
    speculator_type: eagle3
    enabled: false
    model_name: null
    loss_weight: 0.1
    num_layers: null
    aux_layer_indices: null

  # See docs/design-docs/sequence-packing-and-dynamic-batching.md 
  # for more details on dynamic batching and sequence packing.
  dynamic_batching:
    enabled: False
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: True
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    microbatch_order: "packer"
    sequence_length_round: 64

  # makes the training sequence length divisible by the tensor parallel size
  # this is useful for sequence parallel training
  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 5.0e-6
      weight_decay: 0.01
      betas: [0.9, 0.999]
      eps: 1e-8

  scheduler:
    - name: "torch.optim.lr_scheduler.LinearLR"
      kwargs:
        start_factor: 0.1
        end_factor: 1.0
        total_iters: 50
    - name: "torch.optim.lr_scheduler.ConstantLR"
      kwargs:
        factor: 1.0
        total_iters: 10000000000
    - milestones: [50]

  generation:
    # Port range for vLLM HTTP servers, kept below the OS ephemeral range.
    # See ray.sub for the full port layout.
    port_range_low: 3000
    port_range_high: 4999
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    # Validation-only sampling; defaults follow the train values above.
    val_temperature: ${.temperature}
    val_top_p: ${.top_p}
    val_top_k: ${.top_k}
    stop_token_ids: null
    stop_strings: null
    # null = topology default (IPC colocated, NCCL non-colocated). For
    # non-colocated Megatron generation it selects the packed collective; use
    # mcore for native refit.
    # Non-colocated vLLM also supports vllm_s3_sparse, vllm_zmq_sparse, and nixl.
    # Non-colocated vLLM or Megatron generation supports nccl_reshard (M-to-N).
    refit_transport: null
    # vLLM backend only - sglang/megatron/trtllm/dynamo require this to remain null.
    # Selects the NeMo-RL Ray actor class, NOT vLLM's own `worker_extension_cls`.
    worker_extension_cls_fqn: null # optional registered vLLM generation-worker subclass; mutually exclusive with quant_cfg
    # Keep real-quant export tensors on CPU by default. Set false only for
    # colocated CUDA-IPC refit to avoid a GPU -> CPU -> GPU round trip.
    real_quant_export_cpu_offload: true
    refit_cfg:
      nixl:
        update_weights_bucket_memory_ratio: 0.05
        device: cuda
        backend_name: UCX
        backend_init_params: null
        release_after_refit: false
        shard_expert_weights: false
    mcore_generation_config:
      max_model_len: ${policy.max_total_sequence_length}  # Engine-side max sequence length.
      # Generation CUDA graphs. MCore accepts only these pairings:
      #   cuda_graph_impl "none"  -> omit inference_cuda_graph_scope
      #   cuda_graph_impl "local" -> inference_cuda_graph_scope "layer" or "block"
      cuda_graph_impl: "local"
      cuda_graph_sizing_distribution: hybrid  # MCore default: exponential prefill/mixed graphs and linear decode graphs.
      cuda_graph_max_tokens: 512  # MCore default token ceiling for captured prefill/mixed graphs.
      inference_cuda_graph_scope: "block"
      buffer_size_gb: 10
      num_cuda_graphs: 4  # Number of CUDA graphs to pre-compile for different batch sizes
      block_size_tokens: 256  # Size of each KV cache block in tokens (affects memory granularity)
      use_cuda_graphs_for_non_decode_steps: true  # Enable CUDA graphs for prefill/context processing
      enable_chunked_prefill: true  # Split long prefills into chunks for better memory management
      enable_prefix_caching: false  # Reuse KV blocks across requests sharing a prompt prefix.
      prefix_caching_mamba_gb: null  # MCore default: no Mamba-state prefix-cache budget.
      prefix_caching_eviction_policy: lru  # MCore default prefix-cache eviction policy.
      prefix_caching_coordinator_policy: longest_prefix  # MCore default DP routing policy.
      prefix_cache_ttl_seconds: 300.0  # MCore default coordinator cache-entry lifetime.
      prefix_caching_routing_alpha: 1.0  # MCore default load penalty for prefix-affinity routing.
      max_tokens: 16384 # Maximum number of tokens to use in a single step. Analogous to vllm's max_num_batched_tokens
      kv_cache_management_mode: "persist"  # KV cache lifecycle across suspend/resume. Options: "persist", "offload", "recompute".
      async_sched_mode: "async"  # Dynamic-batching scheduler mode. Options: "legacy", "async". "async" hides scheduler CPU time behind GPU compute.
      materialize_only_last_token_logits: true
      num_speculative_tokens: 0
      refit_backend: null  # Native MCore copy-service backend, used only when refit_transport="mcore". Options: "gloo", "nccl", or "nccl_m2n" ("nvshmem" is currently broken, see https://github.com/NVIDIA-NeMo/RL/issues/3646).
      refit_execution_batch_bytes: null  # Native MCore refit staging limit. null matches NeMo-RL's collective default (2% of total GPU memory, capped at 5 GiB); set a positive byte count to override.
      logprobs_mode: processed_logprobs  # Return log-probs after sampling processors. Use raw_logprobs for parity with policy recomputation.
      offload_policy_before_refit: false  # Keep policy state on GPU by default. Enable when a non-colocated Megatron refit needs additional GPU headroom for transfer staging.
      parsers: []  # OpenAI tool-call / response parser names exposed by the HTTP server (only used if expose_http_server=true).
      expose_http_server: false  # Start an OpenAI-compatible HTTP server alongside the persistent engine. Required for NeMo-Gym.
      http_server_num_replicas: 8  # HTTP frontend event loops per model-parallel coordinator.
    vllm_cfg:
      async_engine: false
      precision: ${policy.precision}
      kv_cache_dtype: "auto"
      logprobs_mode: processed_logprobs
      # false: use NeMo-RL's legacy refit loader; true: opt into vLLM reload_weights.
      refit_with_reload_api: false
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1  # When EP > 1, EP must be a multiple of TP since vLLM's EP = DP * TP
      gpu_memory_utilization: 0.3
      max_model_len: ${policy.max_total_sequence_length}
      # when enforce_eager is False, it is optional to set ++policy.generation.vllm_kwargs.compilation_config.backend=eager for better accuracy,
      # with the flag, vllm will use the custom CUDA kernels instead of the Triton kernels generated by torch.compile
      # for more details, see convergence issue https://github.com/NVIDIA-NeMo/RL/issues/998
      enforce_eager: False
      use_tqdm: true # Set to false to suppress vLLM generation progress bars. Only applies when async_engine is false
      use_deep_gemm: False
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      enable_vllm_metrics_logger: true # Set to true to enable vLLM internal metrics logger, turn off for better performance
      vllm_metrics_logger_interval: 0.5 # Interval in seconds to collect vLLM logger metrics
      http_refit_api_key_env_var: null # Optional env var containing the internal refit API key.
      reset_encoder_cache_after_weight_update: false # Invalidate cached multimodal encoder outputs after a successful async refit. Only safe when generation is quiesced (grpo.async_grpo.in_flight_weight_updates=false).
      http_refit_server_port: null # Optional fixed port for Kubernetes targetPorts.
      zmq_refit_server_port: null # Optional fixed ZeroMQ relay port for Kubernetes targetPorts.
    vllm_kwargs: {}
    colocated:
      # true: generation shares training GPUs
      # false: uses dedicated generation resources
      enabled: true
      # only relevant when enabled is false
      resources:
        gpus_per_node: null # Decides num gpus to be dedicated to generation when there is one node in the cluster i.e cluster.num_nodes == 1
        num_nodes: null # Decides number of nodes to be dedicated to generation

data:
  max_input_seq_length: ${policy.max_total_sequence_length} # upper bound, real truncation occurs at vllm.max_model_len
  shuffle: true
  num_workers: 1

  # use multiple dataloader for train
  # see https://github.com/NVIDIA-NeMo/RL/blob/main/docs/guides/grpo.md#multiple-dataloaders for more details.
  use_multiple_dataloader: false

  train:
    dataset_name: LeetCodeExecuteDataset
  validation:
    dataset_name: LeetCodeExecuteDataset

  default:
    use_hint_in_prompt: true
    hint_key: right_code
    

    
    input_key: question_content
    output_key: outputs
    prompt_file: null
    system_prompt_file: null
    processor: "self_distillation_data_processor"
    #env_name: LeetCodeAnswerVerifier
    env_name: math

env:
  math:
    num_workers: 1
    math_verify_impl: "LeetCodeAnswerVerifier"




logger:
  log_dir: ${checkpointing.checkpoint_dir}/logs
  num_val_samples_to_print: 0 # Number of validation samples to pretty print on terminal
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false  # Disable MLflow logging
  swanlab_enabled: false # Disable SwanLab logging
  monitor_gpus: false  # If true, will monitor GPU usage and log to wandb and/or tensorboard
  wandb:
    project: "SELF-GUIDED"
    name: "${grpo.adv_estimator.name}/${policy.model_name}"
    # Complete Gym payloads can create very large W&B artifacts. Enable only for debugging.
    #log_nemo_gym_full_result_tables: false
  swanlab:
    project: "grpo-dev"
    name: "grpo-dev-logger"
  tensorboard: {}
  mlflow:
    experiment_name: "grpo-dev"
    run_name: "grpo-dev-logger"
    tracking_uri: "http://localhost:5000"
  gpu_monitoring:
    collection_interval: 10  # How often to collect GPU usage metrics (in seconds)
    flush_interval: 10  # How often to flush GPU usage metrics to the loggers (in seconds)

cluster:
  gpus_per_node: 1
  num_nodes: 1
  # Port range for the distributed master address (TCPStore / NCCL rendezvous)
  # and per-worker available ports.  Kept below the OS ephemeral range
  # (32768-60999 on stock Linux).  See ray.sub for the full port layout.
  master_port_range_low: 1400
  master_port_range_high: 1999
  segment_size: null  # Nodes per NVLink domain segment for topology-aware alignment; null to disable

# TransferQueue-mediated data plane for sync GRPO.
# Off by default — the legacy grpo_train trainer never engages this.
# Flip enabled=true and run grpo_train_sync to use TQ-mediated bulk
# transfer between rollout and train. See nemo_rl/data_plane/README.md.
data_plane:
  enabled: false
  impl: transfer_queue
  backend: "simple"                  # TQ storage backend ('simple' or 'mooncake_cpu')
  claim_meta_poll_interval_s: 0.5    # blocking-claim poll cadence
  # Backend-specific blocks: only the one named by `backend` is read, and an
  # absent block means that backend's defaults (see SimpleStorageConfig /
  # MooncakeCpuConfig in nemo_rl/data_plane/interfaces.py).
  simple:
    storage_capacity: 1000000        # max samples retained per partition
    num_storage_units: ${mul:2, ${cluster.num_nodes}}  # TQ wants >= 2 per node
  mooncake_cpu:
    # Per client process — see MooncakeCpuConfig before raising these.
    global_segment_size: 68719476736 # 64 GiB/process
    local_buffer_size:    4294967296 # 4 GiB/process
    reuse_registered_buffers: true   # reuse RDMA-registered buffers
    staging_buffer_size:   268435456 # 256 MiB/pool slot; bigger transfers bypass the pool
    use_gdr: false                   # GPU-memory RDMA staging in CUDA clients
    gdr_staging_buffer_mb: 1024      # HBM reserved per active GDR client;
                                     # 8 clients/node is ~8 GiB off the training
                                     # budget. Must exceed the largest per-sample,
                                     # per-field payload: below that, GDR reads of
                                     # CPU-written values fail inside TransferQueue.
                                     # Lower values split fetches into more
                                     # serialized groups and cost throughput;
                                     # higher buys little at linear HBM cost.
                                     # GDR needs that headroom to pay off.
  # observability:                    # NotRequired
  #   enabled: false

# Multi-Teacher On-Policy Distillation (MOPD): distills from one or more teacher
# models into the policy via token-level teacher-minus-student logprob advantages,
# served by non-colocated teacher worker groups (OPD advantage estimator +
# nemo_gym). null = disabled (default). See
# examples/configs/recipes/llm/mopd-qwen3-1.7b-3n8g-megatron-pack.yaml for a full
# enabled example.
on_policy_distillation: null
